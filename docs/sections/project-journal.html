<main id="main" class="shell"><section class="page-intro section-intro"><p class="eyebrow">PROJECT JOURNAL</p><h1>项目手记<span class="section-mark">.</span></h1><p>记录进展，也记录尚未解决的部分。</p></section><section class="section-content"><div class="post-list"><article class="post-row" data-card data-category="项目手记" data-search="项目还没做完，也可以把它讲清楚 设计稿、可运行原型和真实使用，分别回答不同的问题。把状态写清楚，本身就是一种交付。 项目手记 产品定义说明想解决的问题；架构草案说明怎样划分责任；原型让人操作一个流程；测试记录说明哪些条件下发生了什么。它们都有价值，但不能彼此替代。 一个尚无产品代码的项目，可以展示问题拆解和技术取舍。关键是同时写出：现在处于哪一步，已经有怎样的成果。 “在本地浏览器中检查过一个页面”和“适用于所有浏览器”不是同一个结论。一个测试通过，也不能证明跨模块流程或者长期使用没有问题。 展示时，把验证环境与范围放在结果旁边，会比堆叠成绩更容易理解。当前缺口也尽量写成具体下一步，而不是泛泛地说“持续优化”。 这一版本的个人站点是本地草稿。项目简介经过脱敏整理，尚未由本人逐项审定；文章同样是整理稿。公开之前，还需要确认称呼、署名、措辞和可以展示的材料。">
