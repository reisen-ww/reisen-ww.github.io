<main id="main" class="shell"><section class="page-intro section-intro"><p class="eyebrow">MAKING LAB</p><h1>造物实验<span class="section-mark">.</span></h1><p>让想法进入浏览器，试试看。</p></section><section class="section-content"><div class="post-list"><article class="post-row" data-card data-category="造物实验" data-search="网页写完了，还要在浏览器里走一遍 文件生成成功，只说明文件存在。按钮能不能用，窄屏有没有溢出，还需要实际观察。 造物实验 打开首页，沿着导航进入项目和文章，操作一个按钮，再返回原来的位置。如果这条路径走不通，视觉细节再完整也不能弥补它。 还要检查文字、资源和链接。Windows 本地路径、大小写差异、只适合根目录的地址，可能在发布后变成失效链接。 桌面上舒服的列宽，到手机上可能挤在一起。值得检查的不只是截图，还包括有没有横向滚动、长标题能否换行、焦点是否能看见、菜单能否关闭。 动态效果也需要一个退出方式。系统要求减少动效时，页面应该仍然能读、能用；脚本失效时，文章正文也不应该跟着消失。 一次 Chromium 检查不能替代 Safari、Firefox 和真实手机。记录用了哪种环境、检查了哪些行为，可以让后来的人更快找到还需要补充的证据。 原型的价值是把想法变成能被观察的东西。每一轮检查，再让它往可靠靠近一点。">
