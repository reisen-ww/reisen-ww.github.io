<main id="main" class="shell"><section class="page-intro section-intro"><p class="eyebrow">PRODUCT THINKING</p><h1>产品思考<span class="section-mark">.</span></h1><p>从问题出发，理解产品的取舍。</p></section><section class="section-content"><div class="post-list"><article class="post-row" data-card data-category="产品思考" data-search="别急着把 AI 的猜测写成事实 一句很流畅的回答，和一个可以进入正式记录的结论，中间还差一次确认。 产品思考 AI 可以帮忙读材料、提取线索、解释差异，也可以根据上下文提出一个有用的猜想。问题在于，一旦猜想被写入正式能力档案，后面的计划就会把它当成前提。 因此，设计上把候选结论和正式记录分开：候选结论帮助思考，正式记录需要本人确认。能定位到来源，也不等于已经知道它应该如何解释。 以学习路线为例：先澄清目标，整理主动选择的材料，再检查报告，之后才讨论差距和下一步。每次确认都有具体对象，而不是一个笼统的“你同意吗”。 这样做不保证 AI 永远正确，但让误解有机会在进入正式计划前被发现，也让人知道该从哪一步修改。 SLP 尚未成为可运行产品，也没有完成真人验证。这个流程是否方便、会不会增加负担，还需要真实使用证据。现在能够说明的是设计边界，不能提前写成用户效果。">
